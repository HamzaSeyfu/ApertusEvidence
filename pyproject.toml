[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-evidence"
version = "0.4.0"
description = "Evidence-first fact checking over official source material for Hack Apertus 2026."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "HamzaSeyfu"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["pypdf>=5.0"]

[project.scripts]
apertus-evidence = "apertus_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
